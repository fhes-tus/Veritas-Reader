# Android/Gradle defaults
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Use Android Studio's embedded JDK instead of the old Oracle Java 8 shim on PATH.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

# Safer memory settings for Android Studio sync/build on this machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Prevent Gradle from trying to auto-download JDK/toolchains during sync.
# Use Android Studio's Embedded JDK/JDK 17 instead.
org.gradle.java.installations.auto-download=false
